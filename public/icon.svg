      <rect x="92" y="252" width="122" height="78" rx="6" fill="url(#kraft)"/>
      <rect x="92" y="252" width="122" height="16" rx="6" fill="#f1cf9f"/>
      <rect x="146" y="252" width="16" height="78" fill="#f7e3c2" stroke="none"/>
    </g>
    <g transform="rotate(5 160 222)">
