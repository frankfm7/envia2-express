      <rect x="124" y="134" width="88" height="13" rx="6" fill="#f1cf9f"/>
      <rect x="161" y="134" width="13" height="56" fill="#f7e3c2" stroke="none"/>
    </g>
  </g>

  <!-- MOTO -->
  <!-- ruedas -->
