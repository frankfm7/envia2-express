    <circle cx="168" cy="408" r="44" fill="#111827"/><circle cx="168" cy="408" r="24" fill="#6b7280"/><circle cx="168" cy="408" r="10" fill="#d1d5db"/>
    <circle cx="398" cy="408" r="44" fill="#111827"/><circle cx="398" cy="408" r="24" fill="#6b7280"/><circle cx="398" cy="408" r="10" fill="#d1d5db"/>
  </g>
