      <g transform="translate(116 216) scale(.16) skewX(-12)" fill="none" stroke="#ea580c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 34 C14 0 84 -4 84 34 C84 64 40 82 8 118 H84"/><path d="M76 98 L100 118 L76 138"/>
      </g>
    </g>
    <g transform="rotate(-9 168 160)">
