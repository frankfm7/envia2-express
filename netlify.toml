# Configuración para publicar en Netlify (se detecta sola al conectar el repositorio).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirecciones: están en public/_redirects (proxy de inicio de sesión /__/auth/* ANTES del fallback de la app).

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "geolocation=(self), camera=(self), publickey-credentials-get=(self), publickey-credentials-create=(self)"
